<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Nova Messenger</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}.screen{min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#111827;border:1px solid #273247;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0006}.logo{text-align:center;font-size:30px;font-weight:800;margin-bottom:22px}.logo span{color:#7c5cff}.tabs{display:flex;margin-bottom:18px}.tabs button{flex:1;background:none;border:0;color:#8995ab;padding:11px;border-bottom:2px solid transparent}.tabs .on{color:#fff;border-color:#7c5cff}input{width:100%;padding:14px;margin:7px 0;background:#0b1220;color:#fff;border:1px solid #2c374d;border-radius:13px;outline:0}button.primary{width:100%;padding:14px;margin-top:10px;background:#7c5cff;border:0;border-radius:13px;color:#fff;font-weight:700}.hint{color:#8995ab;text-align:center;font-size:13px;margin-top:14px}.error{color:#ff7d91;text-align:center;margin-top:10px;min-height:20px}
</style></head><body><div class="screen"><div class="card"><div class="logo">💬 <span>NOVA</span></div>
<div class="tabs"><button id="loginTab" class="on">Вход</button><button id="regTab">Регистрация</button></div>
<form id="auth"><input id="name" placeholder="Имя" style="display:none"><input id="email" type="email" placeholder="Email" required><input id="pass" type="password" placeholder="Пароль" required><button class="primary" id="submit">Войти</button></form>
<div class="error" id="error"></div><div class="hint">Первая версия Nova • FastAPI + WebSocket</div></div></div>
<script>
let reg=false;const $=id=>document.getElementById(id);
function mode(x){reg=x;$("name").style.display=x?"block":"none";$("name").required=x;$("submit").textContent=x?"Создать аккаунт":"Войти";$("loginTab").className=x?"":"on";$("regTab").className=x?"on":"";$("error").textContent=""}
$("loginTab").onclick=()=>mode(false);$("regTab").onclick=()=>mode(true);
$("auth").onsubmit=async e=>{e.preventDefault();$("error").textContent="";try{
 const url=reg?"/api/register":"/api/login", body=reg?{name:$("name").value,email:$("email").value,password:$("pass").value}:{email:$("email").value,password:$("pass").value};
 const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.detail||"Ошибка");
 localStorage.novaToken=d.access_token;location.href="/chat";
}catch(err){$("error").textContent=err.message}}
</script></body></html>
