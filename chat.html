<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova — Чаты</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:system-ui}.app{height:100dvh;display:grid;grid-template-columns:320px 1fr}.side{background:#111827;border-right:1px solid #273247;padding:18px}.brand{font-size:24px;font-weight:800;margin:5px 4px 20px}.brand span{color:#7c5cff}.side input,.compose input{width:100%;padding:13px;background:#0b1220;border:1px solid #2c374d;border-radius:13px;color:#fff;outline:0}.user{padding:14px 8px;border-radius:12px;margin-top:8px;background:#182236}.main{display:flex;flex-direction:column}.head{height:70px;border-bottom:1px solid #273247;padding:0 18px;display:flex;align-items:center}.head b{flex:1}.head button{background:none;border:0;color:#fff;font-size:20px}.msgs{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:10px}.msg{max-width:75%;padding:11px 14px;background:#182236;border-radius:16px}.mine{align-self:flex-end;background:#6f50e8}.compose{padding:14px;border-top:1px solid #273247;display:flex;gap:8px}.compose input{flex:1}.send{width:48px;border:0;border-radius:13px;background:#7c5cff;color:#fff}.welcome{margin:auto;text-align:center;color:#8792a8}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.main{display:flex}.head{height:62px}.msgs{padding:14px}.msg{max-width:86%}}
</style></head><body><div class="app"><aside class="side"><div class="brand">💬 <span>NOVA</span></div><input placeholder="Поиск"><div class="user" id="me">Загрузка...</div></aside><main class="main"><header class="head"><b>Nova Messenger</b><button onclick="logout()">↪</button></header><section class="msgs" id="msgs"><div class="welcome">Вы вошли в Nova.<br>Откройте второй браузер/телефон и войдите другим аккаунтом.</div></section><form class="compose" id="form"><input id="text" placeholder="Сообщение…" autocomplete="off"><button class="send">➤</button></form></main></div>
<script>
const token=localStorage.novaToken;if(!token)location.href="/";let ws;
async function me(){const r=await fetch("/api/me",{headers:{Authorization:"Bearer "+token}});if(!r.ok)return logout();const d=await r.json();document.getElementById("me").textContent="👤 "+d.name+" • "+d.email}
function add(text,mine){const d=document.createElement("div");d.className="msg"+(mine?" mine":"");d.textContent=text;document.getElementById("msgs").appendChild(d);d.scrollIntoView()}
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws?token="+encodeURIComponent(token));ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==="message")add(d.text,d.mine)};ws.onclose=()=>setTimeout(connect,1500)}
document.getElementById("form").onsubmit=e=>{e.preventDefault();const i=document.getElementById("text");if(!i.value.trim()||!ws||ws.readyState!==1)return;ws.send(JSON.stringify({text:i.value.trim()}));i.value=""}
function logout(){localStorage.removeItem("novaToken");location.href="/"}me();connect();
</script></body></html>
